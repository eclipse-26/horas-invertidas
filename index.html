<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMdT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Horas Mensuales de Trabajo</h1>
    </header>
    <div class="hours-bar">
        <span>0</span>
        <div class="hours-bar__bar">
            <span id="work-time" class="work-time" contenteditable="true"></span>
        </div>
        <span class="hours-bar__total-hours">0h</span>
    </div>
    <main id="main-content" class="content">
        <div id="sections" class="sections">
        </div>
        
        <button id="add-section" class="add-section">
            <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 32 32"><path fill="currentColor" d="M16.5 3.5a.5.5 0 0 0-1 0v12h-12a.5.5 0 0 0 0 1h12v12a.5.5 0 0 0 1 0v-12h12a.5.5 0 0 0 0-1h-12z"/></svg>
            </span>
            Agregar contenedor
        </button>
    </main>
    
    <script src="./add-section.js"></script>
    <script src="./create-sections.js"></script>
    <script src="./add-item.js"></script>
    <script src="./create-items.js"></script>
    <script src="./save-section-name.js"></script>
    <script src="./save-item-data.js"></script>
    <script src="./script.js"></script>
</body>
</html>
